<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Kitchen AI - DevFest Pune Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">Vibe Kitchen 🪩🍳</h1>
        <p class="text-gray-400 mb-6 text-sm">Snap your fridge, pick your mood, and let Gemini cook up a custom recipe!</p>
        
        <form id="recipeForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Fridge Photo / Contents</label>
                <input type="file" id="imageFile" accept="image/*" required class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Your Current Mood / Craving</label>
                <input type="text" id="moodInput" placeholder="e.g., Lazy Sunday, spicy high-protein comfort food" required class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-xl focus:outline-none focus:border-blue-500 text-white">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 font-bold rounded-xl shadow-lg transition duration-200 cursor-pointer">
                Generate Vibe Recipe ✨
            </button>
        </form>

        <div id="loading" class="hidden mt-6 text-center text-blue-400 animate-pulse">
            Chef Gemini is raiding your fridge and cooking up magic... 🍳🔥
        </div>

        <div id="resultContainer" class="hidden mt-6 p-6 bg-gray-900 border border-gray-700 rounded-xl">
            <h2 class="text-xl font-bold text-emerald-400 mb-2">Your Custom Recipe:</h2>
            <div id="recipeOutput" class="text-gray-300 whitespace-pre-wrap text-sm leading-relaxed"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('recipeForm');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const recipeOutput = document.getElementById('recipeOutput');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const imageFile = document.getElementById('imageFile').files[0];
            const mood = document.getElementById('moodInput').value;

            const formData = new FormData();
            formData.append('image', imageFile);
            formData.append('mood', mood);

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/recipe/generate', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    recipeOutput.textContent = data.recipe;
                    resultContainer.classList.remove('hidden');
                } else {
                    alert('Error: ' + (data.error || 'Failed to generate recipe'));
                }
            } catch (err) {
                console.error(err);
                alert('Something went wrong communicating with the server.');
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
